<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

<body>

            <h2>Contact Us</h2>
            <div style="background:#f8fafc; padding:15px; border-radius:10px; margin:15px 0">
                <p>📞 0712 345 678</p>
                <p>💬 WhatsApp: 0712 345 678</p>
                <p>📧 support@softechhomes.co.ke</p>
                <p>📍 Ruiru, Kiambu</p>
            </div>

                <label>Your Name</label><input required><label>Message</label><textarea rows="4" required></textarea>
                <button class="submit-btn" type="submit">Send Message</button>
                <a href="https://wa.me/254712345678" class="wa"
                    style="display:block; text-align:center; margin-top:12px; text-decoration:none; padding:12px; border-radius:10px;">Chat

    </div>
