<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact - SoftechHomes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md text-center">
        <h2 class="text-2xl font-bold mb-4">{{ house.title }}</h2>
        <p class="mb-6">KES {{ "{:,}".format(house.price) }}/month in {{ house.location }}</p>
        <a href="{{ whatsapp_link }}" target="_blank"
            class="bg-green-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-600">
            Message Landlord on WhatsApp
        </a>
        <br><br>
        <a href="/" class="text-blue-600">← Back to Listings</a>
    </div>
</body>

</html>
