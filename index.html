<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftechHomes - Find Your Next Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <a href="/post" class="bg-green-500 text-white px-4 py-2 rounded">Post a House</a>
</head>

<body class="bg-gray-100">
    <nav class="bg-white shadow-md p-4">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold text-blue-600">SoftechHomes</h1>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <h2 class="text-4xl font-bold text-center mb-8">Find Your Next Home</h2>

        <!-- SEARCH FILTERS -->
        <form method="GET" class="bg-white p-6 rounded-lg shadow-md mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" name="location" placeholder="Location: Gathiga, Westlands..." class="border p-3 rounded">
            <input type="number" name="max_price" placeholder="Max Price KES" class="border p-3 rounded">
            <select name="beds" class="border p-3 rounded">
                <option value="">Any Beds</option>
                <option value="1">1 Bed</option>
                <option value="2">2 Beds</option>
                <option value="3">3+ Beds</option>
            </select>
            <button type="submit" class="bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">Search</button>
        </form>

        <!-- HOUSE LISTINGS -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for house in houses %}
            <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
                <img src="{{ house.image }}" class="w-full h-48 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-bold">{{ house.title }}</h3>
                    <p class="text-gray-600">{{ house.location }}</p>
                    <div class="flex justify-between my-3">
                        <span>🛏️ {{ house.beds }} Beds</span>
                        <span>🛁 {{ house.baths }} Baths</span>
                    </div>
                    <p class="text-2xl font-bold text-green-600">KES {{ "{:,}".format(house.price) }}/mo</p>
                    <a href="/contact/{{ house.id }}"
                        class="block text-center bg-green-500 text-white p-3 rounded mt-4 font-bold hover:bg-green-600">
                        Contact on WhatsApp
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
