<!DOCTYPE html>
<html>

<head>
    <title>Post House - PataNyumba</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto p-8 max-w-2xl">
        <h2 class="text-3xl font-bold mb-6">Post Your House</h2>
        <form method="POST" enctype="multipart/form-data" class="bg-white p-6 rounded shadow">
            <input name="title" placeholder="Title" class="border p-2 w-full mb-3 rounded" required>
            <input name="price" type="number" placeholder="Price KES" class="border p-2 w-full mb-3 rounded" required>
            <div class="grid grid-cols-2 gap-3">
                <input name="beds" type="number" placeholder="Beds" class="border p-2 rounded">
                <input name="baths" type="number" placeholder="Baths" class="border p-2 rounded">
            </div>
            <input name="location" placeholder="Location" class="border p-2 w-full my-3 rounded" required>
            <textarea name="description" placeholder="Description" class="border p-2 w-full mb-3 rounded"></textarea>
            <input name="whatsapp" placeholder="Your WhatsApp: 2547XXXXXXXX" class="border p-2 w-full mb-3 rounded"
                required>
            <input name="image" type="file" class="border p-2 w-full mb-3 rounded" accept="image/*" required>
            <button class="bg-blue-600 text-white p-3 w-full rounded font-bold">Post Listing</button>
        </form>
    </div>
</body>

</html>
